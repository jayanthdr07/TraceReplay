[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracereplay"
version = "0.1.2"
description = "Record once. Replay reliably. Test, inspect, and debug AI applications with confidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TraceReplay Contributors" }
]
keywords = [
    "ai",
    "llm",
    "testing",
    "mock",
    "replay",
    "record",
    "vcr",
    "pytest",
    "openai",
    "anthropic",
    "gemini"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.5.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic-settings>=2.2.0",
    "supabase>=2.8.0,<3.0.0",
    "httpx>=0.27.0",
]
backend = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.8.0,<3.0.0",
    "httpx>=0.27.0",
]
openai = [
    "openai>=1.12.0",
]
groq = [
    "groq>=0.9.0",
]
all = [
    "tracereplay[dev,openai,groq]",
]

[project.urls]
Homepage = "https://github.com/rakshithkumar608/TraceReplay"
Documentation = "https://github.com/rakshithkumar608/TraceReplay#readme"
Repository = "https://github.com/rakshithkumar608/TraceReplay"
Issues = "https://github.com/rakshithkumar608/TraceReplay/issues"

[project.scripts]
tracereplay = "tracereplay.cli:main"

[project.entry-points.pytest11]
tracereplay = "tracereplay.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/tracereplay"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]



[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modernize Python syntax)
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["tracereplay", "app"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "openai",
    "openai.*",
    "anthropic",
    "anthropic.*",
    "httpx",
    "httpx.*",
    "groq",
    "groq.*",
    "mistralai",
    "mistralai.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "platform/backend/tests"]
pythonpath = ["src", "platform/backend"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "trace_replay: Record or replay LLM interactions for this test",
]


