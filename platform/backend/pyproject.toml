[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracereplay-platform"
version = "0.1.0"
description = "TraceReplay Web Platform Backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.34.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

